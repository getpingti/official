<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>联系我们 · 方寸设计</title>
<meta name="description" content="联系方寸设计：把你的网址发给我们，先看一版设计稿。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="wrap header-in">
<a class="wordmark" href="index.html">FANGCUN<em>·</em>方寸设计<small>FANGCUN DESIGN STUDIO</small></a>
<button class="burger" onclick="document.querySelector('.main-nav').classList.toggle('open')" aria-label="菜单">☰</button>
<nav class="main-nav">
<a href="index.html">首页</a><a href="service.html">服务项目</a><a href="cases.html">设计案例</a><a href="faq.html">常见问题</a><a href="contact.html" class="active">联系我们</a>
</nav>
<a class="btn head-cta" href="contact.html">预约咨询</a>
</div></header>

<div class="page-hero"><div class="wrap">
<div class="en">Contact</div><h1>聊聊你的网站</h1>
<p>把网址发给我们，先看一版设计稿再说。看不上，不勉强。</p>
</div></div>

<section class="section" style="padding-top:52px"><div class="wrap">
<div class="contact-grid">
<div class="contact-card">
<h3>发邮件给我们</h3>
<p>把公司网址和想解决的问题写在邮件里，我们评估后回复你。</p>
<p style="margin-top:16px"><a class="mail" href="mailto:hello@fangcundesign.com">hello@fangcundesign.com</a></p>
<p style="margin-top:14px">也可以直接在右侧表单里留言，提交后会打开你的邮件客户端发送。</p>
</div>
<div class="contact-card form">
<h3>在线留言</h3>
<form onsubmit="return sendMail(this)">
<label>你的公司网址</label>
<input name="site" placeholder="如：www.example.com" required>
<label>联系电话 / 微信</label>
<input name="contact" placeholder="方便我们回复你">
<label>想解决的问题</label>
<textarea name="msg" rows="4" placeholder="如：网站太旧了，手机上看不了，想改版"></textarea>
<button class="btn" type="submit">发送留言</button>
</form>
</div>
</div>
</div></section>

<footer class="site-footer"><div class="wrap foot-in">
<span>© 方寸设计 FANGCUN DESIGN · 网站设计公司</span>
<a href="service.html">服务项目</a><a href="cases.html">设计案例</a><a href="contact.html">联系我们</a>
<span class="right">本站由无锡方寸文创设计有限公司运营</span>
</div></footer>
<div class="callbar"><a href="cases.html">看案例</a><a href="contact.html">预约咨询</a></div>
<script>
function sendMail(f){
  var body = '公司网址：' + f.site.value + '\n联系方式：' + f.contact.value + '\n想解决的问题：' + f.msg.value;
  location.href = 'mailto:hello@fangcundesign.com?subject=' + encodeURIComponent('网站设计咨询 - ' + f.site.value) + '&body=' + encodeURIComponent(body);
  return false;
}
</script>
</body>
</html>
